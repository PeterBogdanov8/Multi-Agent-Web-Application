<mat-icon class="task-icon">assignment</mat-icon>
<h1 class="heading">Task Details</h1>
<p class="sub-heading">Fill in the following details</p>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field floatLabel="always">
        <mat-label>Role</mat-label>
        <input matInput formControlName="role"/>
    </mat-form-field>
    <mat-form-field floatLabel="always">
        <mat-label>Budget</mat-label>
        <input matInput type="number" formControlName="budget"/>
        <span matTextPrefix>$&nbsp;</span>
    </mat-form-field>
    <button type="submit" matButton="filled" [disabled]="!form.valid">Submit Task</button>
</form>

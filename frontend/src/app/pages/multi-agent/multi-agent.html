<mat-icon class="icon">assignment</mat-icon>
<h1 class="heading">Task(s) Details</h1>
<p class="sub-heading">Fill in the following details</p>

<form class="form" [formArray]="tasksArray" (ngSubmit)="submitTasks()">
    @for (taskGroup of tasksArray.controls; track tasksArray; let i = $index) {
        <div [formGroupName]="i">
            <h2>Task {{i + 1}}</h2>
            <mat-form-field class="field" floatLabel="always">
                <mat-label>Role</mat-label>
                <input matInput formArrayName="role" />
            </mat-form-field>
            <mat-form-field class="field" floatLabel="always">
                <mat-label>Budget</mat-label>
                <input matInput type="number" formControlName="budget"/>
                <span matTextPrefix>$&nbsp;</span>
            </mat-form-field>
            @if (i != 0) {
                <button class="remove-button" matButton="filled" (click)="removeTask(i)">Remove Task</button>
            }
        </div>
    }
    <button matButton="filled" (click)="addTask()">Add Task</button>
    <button class="submit-button" type="submit" matButton="filled" [disabled]="!tasksArray.valid">Submit Tasks</button>
</form>

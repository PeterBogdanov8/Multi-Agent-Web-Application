<mat-icon class="agent-icon">psychology</mat-icon>
<h1>Agent Systems</h1>
<p class="sub-heading">Select the agent system you would like to use:</p>
<mat-grid-list class="grid-list" [cols]="numCols" rowHeight="200px" gutterSize="1rem">
    @for (card of cards; track card.title) {
    <mat-grid-tile class="tile">
        <mat-card class="card" appearance="outlined">
            <mat-card-header>
                <mat-card-title>{{card.title}}</mat-card-title>
                <mat-card-subtitle>{{card.subtitle}}</mat-card-subtitle>
            </mat-card-header>
            <mat-card-content>
                <p>{{card.description}}</p>
            </mat-card-content>
        </mat-card>
    </mat-grid-tile>
    }
</mat-grid-list>

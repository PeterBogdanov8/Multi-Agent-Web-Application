name: Backend Integration

on:
  pull_request:
    branches:
    - main
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./backend
    container:
      image: python:3.14.6
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build Backend
        run: python -m compileall .
  lint:   
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    container:
      image: python:3.14.6
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Linter
        run: ruff check . 
    